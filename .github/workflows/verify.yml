name: RTL verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Simulate and synthesize (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Set up project-local tools and run smoke checks
        run: python tools/run.py setup
      - name: Run regression, application demo, benchmarks and synthesis
        run: python tools/run.py all
      - name: Add measured results to job summary
        if: success()
        shell: pwsh
        run: Get-Content reports/RESULTS.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence
          retention-days: 14
          path: |
            reports/
            build/logs/
            build/firmware.hex
            build/firmware.lst

name: RTL verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Simulate and synthesize (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Set up project-local tools and run smoke checks
        run: python tools/run.py setup
      - name: Run regression, application demo, benchmarks and synthesis
        run: python tools/run.py all
      - name: Add measured results to job summary
        if: success()
        shell: pwsh
        run: Get-Content reports/RESULTS.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          retention-days: 14
          path: |
            reports/
            build/logs/
            build/firmware.hex
            build/firmware.lst

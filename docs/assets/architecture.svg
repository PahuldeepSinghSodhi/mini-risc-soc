<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">MiniRISC — a processor with a purpose</title>
  <desc id="desc">A custom 32-bit multicycle CPU connects sensor buffering, temperature firmware, UART and GPIO output, and reproducible verification.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c34"/><stop offset="1" stop-color="#08101e"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#233451" stroke-opacity=".35"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="48" y="53" fill="#65d7de" font-size="13" font-weight="700" letter-spacing="3">SYSTEMVERILOG · FIRMWARE · VERIFICATION</text>
    <text x="46" y="114" fill="#f2f6ff" font-size="52" font-weight="700">MiniRISC SoC</text>
    <text x="48" y="150" fill="#aebdd4" font-size="19">A custom processor. A measurable monitoring workload.</text>
    <g fill="#12233d" stroke="#314b6f" stroke-width="1.5">
      <rect x="48" y="211" width="218" height="113" rx="12"/>
      <rect x="316" y="193" width="295" height="149" rx="12" stroke="#65d7de"/>
      <rect x="662" y="211" width="218" height="113" rx="12"/>
      <rect x="930" y="211" width="222" height="113" rx="12"/>
    </g>
    <g stroke="#65d7de" fill="none" stroke-width="2"><path d="M266 267H316M611 267H662M880 267H930"/></g>
    <g fill="#65d7de"><path d="m307 262 9 5-9 5m346-10 9 5-9 5m268-10 9 5-9 5"/></g>
    <g fill="#f2f6ff" font-size="19" font-weight="600">
      <text x="70" y="246">Sensor input</text><text x="341" y="233">32-bit multicycle CPU</text>
      <text x="684" y="246">UART + GPIO</text><text x="952" y="246">Measured evidence</text>
    </g>
    <g fill="#aebdd4" font-size="15">
      <text x="70" y="276">16-entry FIFO</text><text x="70" y="300">Visible overflow accounting</text>
      <text x="341" y="264">16 registers · custom ISA</text><text x="341" y="289">Temperature filter + hysteresis</text><text x="341" y="315">Synchronous ROM / RAM</text>
      <text x="684" y="276">Serial event records</text><text x="684" y="300">Alarm state + counters</text>
      <text x="952" y="276">RTL tests + raw traces</text><text x="952" y="300">Benchmarks + synthesis</text>
    </g>
    <text x="48" y="372" fill="#6d859f" font-size="13">SIMULATED EQUIPMENT MONITORING · REPRODUCIBLE WINDOWS WORKFLOW · MIT LICENSE</text>
  </g>
</svg>
